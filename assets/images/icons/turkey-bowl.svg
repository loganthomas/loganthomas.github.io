<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Turkey tail feathers fanned behind the football -->
  <g transform="translate(32, 38)">
    <!-- Outer feathers - deep cranberry red -->
    <ellipse cx="0" cy="-24" rx="5" ry="16" fill="#9B2335" transform="rotate(-40)"/>
    <ellipse cx="0" cy="-24" rx="5" ry="16" fill="#9B2335" transform="rotate(40)"/>
    <!-- Mid feathers - burnt orange -->
    <ellipse cx="0" cy="-22" rx="4.5" ry="15" fill="#D4652F" transform="rotate(-24)"/>
    <ellipse cx="0" cy="-22" rx="4.5" ry="15" fill="#D4652F" transform="rotate(24)"/>
    <!-- Inner feathers - harvest gold -->
    <ellipse cx="0" cy="-21" rx="4" ry="14" fill="#E8A735" transform="rotate(-10)"/>
    <ellipse cx="0" cy="-21" rx="4" ry="14" fill="#E8A735" transform="rotate(10)"/>
    <!-- Center feather - warm amber -->
    <ellipse cx="0" cy="-20" rx="3.5" ry="13" fill="#C67C25"/>
  </g>
  <!-- Football body -->
  <ellipse cx="32" cy="38" rx="18" ry="12" fill="#6B3A1F" stroke="#4A2710" stroke-width="1.5"/>
  <!-- Football highlight for depth -->
  <ellipse cx="30" cy="35" rx="14" ry="7" fill="#7D4A2A" opacity="0.6"/>
  <!-- Laces -->
  <line x1="32" y1="29" x2="32" y2="47" stroke="#F5F0E8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="32" x2="36" y2="32" stroke="#F5F0E8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="27.5" y1="36" x2="36.5" y2="36" stroke="#F5F0E8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="28" y1="40" x2="36" y2="40" stroke="#F5F0E8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="28.5" y1="44" x2="35.5" y2="44" stroke="#F5F0E8" stroke-width="1.4" stroke-linecap="round"/>
</svg>
